name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Build-time placeholders only -- no real service is ever contacted. Every
  # data-driven route reads cookies via Supabase SSR (lib/supabase/server.ts),
  # which forces dynamic rendering, so `next build` never prerenders a page
  # against these values.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  GROQ_API_KEY: placeholder-groq-key

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
